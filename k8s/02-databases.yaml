apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-postgres
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voleiplay-postgres
  template:
    metadata:
      labels:
        app: voleiplay-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgrespassword"
        - name: POSTGRES_DB
          value: "voleiplay"
        ports:
        - containerPort: 5432
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-postgres
  namespace: voleiplay-k8s
spec:
  selector:
    app: voleiplay-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-redis
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voleiplay-redis
  template:
    metadata:
      labels:
        app: voleiplay-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: "128Mi"
            cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-redis
  namespace: voleiplay-k8s
spec:
  selector:
    app: voleiplay-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-mongodb
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voleiplay-mongodb
  template:
    metadata:
      labels:
        app: voleiplay-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports:
        - containerPort: 27017
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-mongodb
  namespace: voleiplay-k8s
spec:
  selector:
    app: voleiplay-mongodb
  ports:
  - port: 27017
    targetPort: 27017
