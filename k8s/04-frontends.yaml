apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-spa
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-spa
    tier: frontend
    architecture: monolith-spa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voleiplay-spa
  template:
    metadata:
      labels:
        app: voleiplay-spa
    spec:
      containers:
      - name: nginx-spa
        image: voleiplay-spa:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-spa
  namespace: voleiplay-k8s
spec:
  type: NodePort
  selector:
    app: voleiplay-spa
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
---
