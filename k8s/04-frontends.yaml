apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-ssr
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-ssr
    tier: frontend
    architecture: server-side-rendering
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voleiplay-ssr
  template:
    metadata:
      labels:
        app: voleiplay-ssr
    spec:
      containers:
      - name: ssr-engine
        image: voleiplay-ssr:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "4000"
        ports:
        - containerPort: 4000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-ssr
  namespace: voleiplay-k8s
spec:
  type: NodePort
  selector:
    app: voleiplay-ssr
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30040
