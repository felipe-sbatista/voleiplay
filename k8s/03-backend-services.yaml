apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-backend
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: voleiplay-backend
  template:
    metadata:
      labels:
        app: voleiplay-backend
    spec:
      containers:
      - name: backend
        image: voleiplay-backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: voleiplay-config
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-backend
  namespace: voleiplay-k8s
spec:
  type: NodePort
  selector:
    app: voleiplay-backend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-auth
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voleiplay-auth
  template:
    metadata:
      labels:
        app: voleiplay-auth
    spec:
      containers:
      - name: auth
        image: voleiplay-auth:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "3007"
        - name: ELASTIC_APM_ACTIVE
          value: "false"
        ports:
        - containerPort: 3007
        resources:
          requests:
            memory: "96Mi"
            cpu: "80m"
          limits:
            memory: "256Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-auth
  namespace: voleiplay-k8s
spec:
  type: NodePort
  selector:
    app: voleiplay-auth
  ports:
  - port: 3007
    targetPort: 3007
    nodePort: 30007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voleiplay-email
  namespace: voleiplay-k8s
  labels:
    app: voleiplay-email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voleiplay-email
  template:
    metadata:
      labels:
        app: voleiplay-email
    spec:
      containers:
      - name: email
        image: voleiplay-email:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "3004"
        - name: ELASTIC_APM_ACTIVE
          value: "false"
        ports:
        - containerPort: 3004
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "192Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: voleiplay-email
  namespace: voleiplay-k8s
spec:
  type: NodePort
  selector:
    app: voleiplay-email
  ports:
  - port: 3004
    targetPort: 3004
    nodePort: 30004
