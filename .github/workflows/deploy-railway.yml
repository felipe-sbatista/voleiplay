name: VoleiPlay CI/CD - Railway Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite disparo manual com 1 clique no GitHub Actions

jobs:
  # ─────────────────────────────────────────────────────────────
  # ETAPA 1: INTEGRAÇÃO CONTÍNUA (CI) - Testes & Typecheck
  # ─────────────────────────────────────────────────────────────
  ci:
    name: 🧪 CI (Lint, Types & Testes)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: 📦 Instalar Dependências do Backend
        run: |
          npm --prefix backend install

      - name: 🔍 Typecheck do Backend (TypeScript)
        run: |
          npx --prefix backend tsc --noEmit

      - name: ⚡ Testar Serverless Function (Calculadora de MVP)
        run: |
          npx tsx serverless/mvp-calculator/verify-calculator.ts

  # ─────────────────────────────────────────────────────────────
  # ETAPA 2: ENTREGA CONTÍNUA (CD) - Deploy no Railway
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 CD (Deploy no Railway)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚂 Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Executar Deploy no Railway
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Iniciando deploy no serviço 'voleiplay' no Railway..."
          railway up --service voleiplay --detach

      - name: ⏱️ Aguardar Propagação do Deploy
        run: |
          echo "Aguardando inicialização do contêiner e healthcheck..."
          sleep 20

      - name: 🩺 Validar Saúde da API em Produção
        run: |
          echo "Testando endpoint /health no Railway..."
          curl --fail --retry 6 --retry-delay 5 https://voleiplay-production.up.railway.app/health

      - name: 🏐 Validar Endpoint Serverless em Produção
        run: |
          echo "Testando endpoint /serverless/mvp-calculator no Railway..."
          curl --fail --retry 6 --retry-delay 5 https://voleiplay-production.up.railway.app/serverless/mvp-calculator
